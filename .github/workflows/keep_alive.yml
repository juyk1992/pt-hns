name: Keep Streamlit Alive with Empty Commit

on:
  schedule:
    # 3시간마다 빈 커밋 생성 (GitHub cron 제약 고려)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty commit to wake Streamlit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Chore: Keep Streamlit App Alive [skip ci]"
          git push
