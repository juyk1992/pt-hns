name: Build KCG Vector DB

on:
  workflow_dispatch:

jobs:
  build-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sentence-transformers langchain-huggingface langchain-community langchain-text-splitters chromadb pypdf
          
      - name: Run Vector DB Build Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_rag_db.py

      - name: Commit and Push Vector DB Folder
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add kcg_guide_chromadb/
          git commit -m "auto: Build and update KCG Vector DB" || echo "No changes to commit"
          git push
